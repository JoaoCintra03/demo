<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <title>UniALFA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">UniALFA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/alunos}">Alunos</a>
                </li>
                <!-- Link adicionado para Professores -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/professores}">Professores</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>

<!-- Tabela de Alunos -->
<div th:fragment="tabelaAlunos(alunos)">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>RA</th>
            <th>Nome</th>
            <th>CPF</th>
            <th>Endereço</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="aluno : ${alunos}">
            <td th:text="${aluno.ra}"></td>
            <td th:text="${aluno.nome}"></td>
            <td th:text="${aluno.cpf}"></td>
            <td th:text="${aluno.endereco}"></td>
            <td>
                <a th:href="@{/alunos/alterar/{ra}(ra=${aluno.ra})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/alunos/remover/{ra}(ra=${aluno.ra})}" class="btn btn-danger btn-sm">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Fragmento adicionado para Tabela de Professores -->
<div th:fragment="tabelaProfessores(professores)">
    <table class="table table-striped table-hover">
        <thead class="table-secondary">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Título</th>
            <th>Endereço</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="professor : ${professores}">
            <td th:text="${professor.id}"></td>
            <td th:text="${professor.nome}"></td>
            <td th:text="${professor.titulo}"></td>
            <td th:text="${professor.endereco}"></td>
            <td>
                <a th:href="@{/professores/alterar/{id}(id=${professor.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/professores/remover/{id}(id=${professor.id})}" class="btn btn-danger btn-sm">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
