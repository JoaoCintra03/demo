<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3 class="card-title mb-0" th:text="${professor.id == null ? 'Novo Cadastro de Professor' : 'Editar Professor'}">Cadastro de Professor</h3>
        </div>
        <div class="card-body">
            <!-- th:object="${professor}" permite vincular os campos diretamente aos atributos da classe -->
            <form th:action="@{/professores/salvar}" th:object="${professor}" method="post">

                <!-- Campo oculto para o ID (importante para o método atualizar) -->
                <input type="hidden" th:field="*{id}">

                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label font-weight-bold">Nome Completo</label>
                        <input type="text" class="form-control" th:field="*{nome}" placeholder="Digite o nome do professor" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label font-weight-bold">Título</label>
                        <select class="form-select" th:field="*{titulo}" required>
                            <option value="">Selecione...</option>
                            <option value="Especialista">Especialista</option>
                            <option value="Mestre">Mestre</option>
                            <option value="Doutor">Doutor</option>
                            <option value="Pós-Doutor">Pós-Doutor</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <label class="form-label font-weight-bold">Endereço</label>
                        <input type="text" class="form-control" th:field="*{endereco}" placeholder="Rua, Número, Bairro, Cidade" required>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary px-4">Salvar Registro</button>
                    <a th:href="@{/professores}" class="btn btn-secondary px-4">Voltar para Lista</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
