<!DOCTYPE html>
<div class="container" xmlns:th="http://www.w3.org/1999/xhtml">
    <form th:action="@{/professores/salvar}" method="post">
        <div class="row">
            <div class="col">
                <label for="id" class="form-label">ID</label>
                <input id="id" type="number" class="form-control"
                       name="id" th:value="${professor.id}"
                       readonly>
            </div>
            <div class="col">
                <label for="nome" class="form-label">Nome</label>
                <input id="nome" type="text" class="form-control"
                       placeholder="Nome" required
                       name="nome" th:value="${professor.nome}">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="titulo" class="form-label">Título</label>
                <input id="titulo" type="text" class="form-control"
                       placeholder="Título" required
                       name="titulo" th:value="${professor.titulo}">
            </div>
            <div class="col">
                <label for="endereco" class="form-label">Endereço</label>
                <input id="endereco" type="text" class="form-control"
                       placeholder="Endereço" required
                       name="endereco" th:value="${professor.endereco}">
            </div>
        </div>

        <div class="row">
            <div class="p-3 m-0 border-0 bd-example m-0 border-0">
                <div class="d-grid gap-2 d-md-block">
                    <input class="btn btn-primary" type="submit" value="Salvar"/>
                </div>
            </div>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
