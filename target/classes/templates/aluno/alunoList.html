<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar}"></nav>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestão de Alunos</h2>
        <a th:href="@{/alunos/novo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Cadastrar Novo Aluno
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <div th:replace="~{fragments/fragments :: tabelaAlunos(${alunos})}"></div>

            <div th:if="${#lists.isEmpty(alunos)}" class="alert alert-info mt-3 text-center">
                Nenhum aluno encontrado na base de dados.
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/fragments :: scripts}"></div>
</body>
</html>
